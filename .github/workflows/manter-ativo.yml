# Mantém o projeto do Supabase acordado: o plano gratuito pausa o banco após ~7 dias sem uso.
# Roda uma vez por dia no repositório público do site (o web/publicar.mjs copia este arquivo
# para .github/workflows/). Se o banco já estiver pausado, a tarefa falha e o GitHub avisa por
# e-mail; aí é só rodar: node supabase/gerenciar.mjs restaurar
name: Manter o banco ativo

on:
  schedule:
    - cron: '17 11 * * *' # todo dia às 08:17 (horário de Brasília)
  workflow_dispatch:

jobs:
  acordar:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta simples ao banco
        run: |
          curl -sSf --retry 3 --retry-delay 30 -m 30 -X POST \
            "https://shligovobghpcxixwqup.supabase.co/rest/v1/rpc/barbearia_por_codigo" \
            -H "apikey: sb_publishable_LJltSFp7WESGSleC33Y3Tg_YqJqAtRW" \
            -H "Content-Type: application/json" \
            -d '{"p_codigo":"mdm"}'
